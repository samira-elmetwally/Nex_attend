<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexAttend - Student Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4ecf9;
            --primary-color: #9d00ff;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --hover-bg: #f3e5f5;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --primary-color: #bf40ff; /* slightly lighter purple for dark mode */
            --sidebar-bg: #1e1e1e;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --hover-bg: #2d2d2d;
        }
        
        [data-theme="dark"] .search-bar { background: #2d2d2d; }
        [data-theme="dark"] .search-bar input { color: #fff; }
        [data-theme="dark"] table th, [data-theme="dark"] table td { border-bottom-color: #2d2d2d; }
        [data-theme="dark"] .circular-chart::before, [data-theme="dark"] .mini-chart::before { background-color: #1e1e1e; }
        [data-theme="dark"] .color-progress { background: #2d2d2d; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-radius: 0 30px 30px 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 30px;
            margin-bottom: 40px;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
        }

        .logo i {
            color: var(--primary-color);
            font-size: 24px;
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            margin-bottom: 5px;
        }

        .nav-item i { font-size: 18px; width: 20px; }

        .nav-item.active {
            color: var(--primary-color);
            background-color: var(--hover-bg);
            border-right: 4px solid var(--primary-color);
        }

        .nav-item:hover:not(.active) {
            background-color: #f9f9f9;
            color: var(--text-main);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 20px;
            width: 400px;
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            margin-left: 10px;
            width: 100%;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-actions i {
            font-size: 20px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Dashboard Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 20px;
        }

        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .right-panel { display: flex; flex-direction: column; gap: 20px; }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .stat-card i {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 20px;
        }

        .stat-card h3 { font-size: 14px; color: var(--text-main); margin-bottom: 5px; }
        .stat-card p { font-size: 24px; font-weight: bold; color: var(--text-main); }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-header h2 { font-size: 18px; color: var(--text-main); }
        .section-header a { color: var(--primary-color); text-decoration: none; font-size: 14px; font-weight: bold; }

        /* Popular Courses */
        .courses-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .course-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            padding-bottom: 15px;
        }

        .course-img {
            height: 120px;
            background: #ddd;
            position: relative;
        }

        .course-price {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .course-info { padding: 15px; }
        .course-info .category { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .course-info h3 { font-size: 15px; margin-bottom: 10px; color: var(--text-main); }
        .course-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

        /* My Courses Table */
        .table-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; }
        td { color: var(--text-main); font-weight: 500; }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-complete { background: #e0f7eb; color: #00a65a; }
        .status-ongoing { background: #e0f0ff; color: #007bff; }

        /* Right Panel - Progress Charts */
        .progress-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        /* CSS Circular Chart */
        .circular-chart {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--primary-color) 70%, #f0f0f0 0);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .circular-chart::before {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            background-color: var(--card-bg);
            border-radius: 50%;
        }

        .chart-value {
            position: relative;
            font-size: 28px;
            font-weight: bold;
            color: var(--text-main);
        }

        .chart-legend { width: 100%; }
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; color: var(--text-muted); }
        .legend-color { width: 15px; height: 15px; border-radius: 4px; }
        .color-progress { background: #f0f0f0; }
        .color-completed { background: var(--primary-color); }

        /* Continue Learning List */
        .continue-learning-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .learning-item {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .learning-info { display: flex; align-items: center; gap: 10px; }
        .learning-icon { width: 40px; height: 40px; background: var(--hover-bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary-color); }
        .learning-text h4 { font-size: 14px; color: var(--text-main); }
        .learning-text p { font-size: 12px; color: var(--primary-color); font-weight: bold; }

        /* Mini Chart */
        .mini-chart {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mini-chart::before {
            content: "";
            position: absolute;
            width: 38px;
            height: 38px;
            background-color: var(--card-bg);
            border-radius: 50%;
        }
        .mini-value { position: relative; font-size: 12px; font-weight: bold; color: var(--text-main); }

    
        [data-theme="dark"] .notif-dropdown { background: var(--card-bg); border: 1px solid #333; }
        [data-theme="dark"] .notif-dropdown h4 { border-bottom-color: #333; color: #fff;}
        .notif-item { padding: 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: var(--text-main); cursor: pointer;}
        .notif-item:hover { background: var(--hover-bg); }
        [data-theme="dark"] .notif-item { border-bottom-color: #333;}
        .notif-item:last-child { border-bottom: none; }
        .notif-time { font-size: 11px; color: var(--primary-color); display: block; margin-top: 5px; }

    </style>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>NexAttend</span>
        </div>
        <ul class="nav-menu">
            <a href="student.html" class="nav-item active"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="courses.html" class="nav-item"><i class="fa-solid fa-layer-group"></i> All Courses</a>
            <a href="saved-courses.html" class="nav-item"><i class="fa-regular fa-bookmark"></i> Saved Courses</a>
            <a href="attendance.html" class="nav-item"><i class="fa-solid fa-qrcode"></i> Attendance</a>
            <a href="report.html" class="nav-item"><i class="fa-regular fa-file-lines"></i> Report</a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" placeholder="Search">
            </div>
            <div class="user-actions">
                <i class="fa-solid fa-moon" id="themeToggle" style="cursor: pointer;" title="Toggle Dark Mode"></i>
                <div class="notifications-container" style="position: relative;">
                    <i class="fa-regular fa-bell" id="notifToggle" style="cursor: pointer;"></i>
                    <span class="notif-badge" id="notifBadge" style="position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 5px; font-size: 10px; font-weight: bold; display: none;">0</span>
                    <div class="notif-dropdown" id="notifDropdown" style="display: none; position: absolute; right: -50px; top: 40px; width: 320px; background: var(--card-bg); box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 10px; z-index: 100; padding: 10px;">
                        <h4 style="padding: 10px; border-bottom: 1px solid #eee; margin-bottom: 5px; color: var(--text-main);">Notifications</h4>
                        <div id="notifList" style="max-height: 300px; overflow-y: auto;">
                            <!-- Notifications injected here -->
                        </div>
                    </div>
                </div>
                <div class="user-avatar" id="navAvatar" title="My Profile" style="cursor:pointer;">0x</div>
                <i class="fa-solid fa-right-from-bracket" id="logoutBtn" style="cursor: pointer; color: var(--text-muted); font-size: 20px;" title="Logout"></i>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="left-panel">
                <h2 style="font-size: 22px; color: #333;">Dashboard</h2>
                
                <div id="dashStatsGrid" class="stats-container" data-simple="1" style="grid-template-columns: repeat(2, 1fr);"></div>

                <div class="section-header">
                    <h2>Course catalog preview</h2>
                    <a href="courses.html">Browse all courses</a>
                </div>
                <div id="dashboardCoursePreview" class="courses-container"></div>
            </div>

            <div class="right-panel">
                <div class="progress-card">
                    <div class="circular-chart">
                        <span class="chart-value">70%</span>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-color color-progress"></div>
                            <span>In Progress</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color color-completed"></div>
                            <span>Completed</span>
                        </div>
                    </div>
                </div>

                <div class="section-header">
                    <h2>Quick links</h2>
                </div>
                <div id="continueLearningList" class="continue-learning-list"></div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/student.js"></script>
</body>
</html>
